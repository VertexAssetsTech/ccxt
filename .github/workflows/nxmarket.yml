name: nxmarket

# Offline checks for the nxmarket exchange only: lint, build, and ccxt's static
# request/response tests in JS and Python, plus transpile + compile for PHP, Go
# and C#. Runs on GitHub-hosted runners; the upstream language workflows need
# ccxt's self-hosted runners and do not run in this fork.

on:
  pull_request:
    branches: [ master, 'feat/**', 'fix/**' ]
    paths:
      - 'ts/src/nxmarket.ts'
      - 'ts/src/abstract/nxmarket.ts'
      - 'ts/src/pro/nxmarket.ts'
      - 'ts/src/test/static/**/nxmarket.json'
      - 'ts/ccxt.ts'
      - '.github/workflows/nxmarket.yml'
  push:
    branches: [ 'feat/ccxt-developer-api' ]
    paths:
      - 'ts/src/nxmarket.ts'
      - 'ts/src/abstract/nxmarket.ts'
      - 'ts/src/pro/nxmarket.ts'
      - 'ts/src/test/static/**/nxmarket.json'
      - 'ts/ccxt.ts'
      - '.github/workflows/nxmarket.yml'
  workflow_dispatch:

concurrency:
  group: nxmarket-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js-python-php:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/ci-requirements.txt
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Install Python dependencies
        run: pip install -r build/ci-requirements.txt
      - name: Register the exchange and emit the implicit api
        run: npm run export-exchanges && npm run emitAPI
      - name: Committed abstract and registration are current
        run: git diff --exit-code -- ts/src/abstract/nxmarket.ts ts/ccxt.ts
      - name: Lint
        run: npm run eslint -- ts/src/nxmarket.ts
      - name: Build JS (tsc)
        run: npm run tsBuild
      - name: JS id tests
        run: npm run id-tests-js -- nxmarket
      - name: JS static request tests
        run: npm run request-js -- nxmarket
      - name: JS static response tests
        run: npm run response-js -- nxmarket
      - name: Transpile to Python and PHP
        run: npx tsx build/transpile.ts nxmarket
      - name: Python static request tests
        run: npm run request-py-async -- nxmarket
      - name: Python static response tests
        run: npm run response-py-async -- nxmarket
      - name: PHP syntax
        run: php -l php/nxmarket.php && php -l php/async/nxmarket.php && php -l php/abstract/nxmarket.php

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Register the exchange and emit the implicit api
        run: npm run export-exchanges && npm run emitAPI
      - name: Transpile nxmarket to Go
        run: npm run go-build-single -- nxmarket
      - name: Build Go
        run: go build -C go ./v4

  csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'
      - name: Install npm dependencies
        run: npm ci --include=dev
      - name: Register the exchange and emit the implicit api
        run: npm run export-exchanges && npm run emitAPI
      - name: Transpile nxmarket to C#
        run: npm run transpileCsSingle -- nxmarket
      - name: Build C#
        run: dotnet build cs/ccxt/ccxt.csproj
